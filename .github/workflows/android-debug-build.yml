name: Android Debug Build
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Stage web assets into www/
        run: |
          mkdir -p www
          cp -r index.html css js www/
      - name: Upload raw www/ for the OTA bundling job
        uses: actions/upload-artifact@v4
        with:
          name: www-raw
          path: www/
      - name: Sync Capacitor (copies www/ into the Android project)
        run: npx cap sync android
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Decode stable debug keystore
        run: |
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > android/app/debug.keystore
      - name: Build debug APK
        working-directory: android
        env:
          DEBUG_KEYSTORE_PATH: debug.keystore
          DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
          DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
          DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yeroscare-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  bundle-www:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download raw www/ from the build job
        uses: actions/download-artifact@v4
        with:
          name: www-raw
          path: www
      - name: Zip www/ for OTA upload (index.html at the zip root)
        run: |
          cd www
          zip -r ../yeroscare-www-bundle.zip .
      - name: Upload OTA-ready www bundle
        uses: actions/upload-artifact@v4
        with:
          name: yeroscare-www-bundle
          path: yeroscare-www-bundle.zip
